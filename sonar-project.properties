# SonarQube Cloud project settings. The two keys below must match the project created on
# sonarcloud.io; these are the defaults it derives from the GitHub organization and repository.
sonar.organization=splicefs
sonar.projectKey=SpliceFS_client

sonar.sources=.
sonar.exclusions=**/*_test.go,docs/**,bin/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
# Three reports: the Linux run of every package but mount/fuse, the Linux run of mount/fuse, and
# the macOS run. The macOS one covers the files that are built only there.
sonar.go.coverage.reportPaths=coverage.out,coverage-fuse.out,coverage-darwin.out
