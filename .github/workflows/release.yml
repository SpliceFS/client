name: Release

# A version tag builds the programs of every system, makes the release archives, signs the list
# of their checksums and creates the GitHub release. This repository then hands the release to
# the package repository (SpliceFS/packages), which builds, tests, signs and publishes the
# packages, tells the website and the Homebrew tap, all from the archives of the release. Only
# version tags can use the publish environment, which holds the signing key.
#
#   verify -> build -> release -> packages
#
# The release job is the only one in the publish environment, and it removes its key file at its
# end. The last job runs outside the environment and holds no key.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A release tag is checked once, here, before any other job starts. The jobs that build, sign
  # or publish all need this job, so nothing is built from a tag that is not a release of main.
  verify:
    name: The tag is a release of main
    runs-on: ubuntu-latest
    steps:
      # The check below that the tagged commit is on main needs the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A tag can sit on any commit. Only a commit on main may publish, and the tag must
      # name the version that VERSION gives. This runs before any key is written.
      - name: The tag is a release of main
        run: |
          # Fetch main by name, so that origin/main is the current tip and not the state
          # of the last checkout.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit is not on main, so it cannot be released"
            exit 1
          fi
          version="$(cat VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, but VERSION says v$version"
            exit 1
          fi

  # Nothing is tested in a release: the tag is on a commit whose files passed every check as a
  # pull request on the tip of main. No Go cache is kept either: a release runs on a tag, which
  # can restore the caches of main only, and nothing saves one there.
  #
  # Every program for every system, compiled once. The release job archives these files and
  # compiles nothing. This job holds no key and is not part of the publish environment.
  build:
    name: Build every program
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build for linux, freebsd and darwin on amd64 and arm64
        run: make build-all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin
          path: dist/bin
          if-no-files-found: error

  # Archives the programs of the build job, signs the list of the checksums of the archives,
  # and creates the GitHub release with them. The package repository trusts nothing but this
  # signature, so the files are not uploaded anywhere else.
  release:
    name: Create the release
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: publish
    permissions:
      # Needed to create the release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/release-keys
        with:
          signing-openpgp-subkey: ${{ secrets.SIGNING_OPENPGP_SUBKEY }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin
          path: dist/bin
      - name: Archive the programs of every system and CPU type
        run: make archives
      - name: Collect and sign the release files
        run: make release-assets
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every merge is a release, so the notes are the change that was merged:
          # GitHub writes them from the pull request. The files are everything in
          # dist/release, which scripts/release-assets.sh fills: the one list of them.
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --generate-notes dist/release/*
      - name: Remove the secret files
        if: always()
        uses: ./.github/actions/remove-release-keys

  # The package repository publishes the packages of this release. It reads the release that
  # was created above, so it is told only after that. This job runs outside the publish
  # environment and holds none of its keys. The token is the one of the release bot, for the
  # package repository only, and it can do no more than send the event. When this job fails,
  # the release is out all the same: run the Publish program workflow of the package repository
  # by hand with the program and the tag.
  packages:
    name: Hand the release to the package repository
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Bot token for the package repository
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: SpliceFS
          repositories: packages
          permission-contents: write
      - name: Tell the package repository to publish this release
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PROGRAM: client
          TAG: ${{ github.ref_name }}
        run: |
          # The event type tells the package repository to tag and publish now. It reads the
          # releases themselves, not these two values, which name the release in its run.
          # A failed call fails the step.
          jq -n --arg program "$PROGRAM" --arg tag "$TAG" \
            '{event_type: "program-released", client_payload: {program: $program, tag: $tag}}' \
            > "$RUNNER_TEMP/dispatch.json"
          gh api --method POST repos/SpliceFS/packages/dispatches --input "$RUNNER_TEMP/dispatch.json"

  # A failed run of this workflow opens an issue assigned to the account in the repository
  # variable ALERT_ASSIGNEE, so that someone gets an email; GitHub sends none for runs the
  # bots start. Pull requests are left out: their author sees the failed check there.
  alert:
    name: Report a failure
    needs: [verify, build, release, packages]
    if: ${{ failure() && github.event_name != 'pull_request' }}
    permissions:
      issues: write
    uses: SpliceFS/.github/.github/workflows/report-failure-v1.yml@main
    with:
      assignee: ${{ vars.ALERT_ASSIGNEE }}
