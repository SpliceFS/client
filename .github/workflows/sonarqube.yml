name: SonarQube
# Every job has a time limit: 3 times its longest run, so a hang fails in minutes.

# Code quality and security rating on SonarQube Cloud. The job does nothing until the
# repository secret SONAR_TOKEN exists; see CONTRIBUTING.md for the one-time setup.

on:
  push:
    branches: [main]
  pull_request:

# Each job names what it needs.
permissions: {}

jobs:
  # The files that exist only on macOS are tested only there. Without their coverage the
  # scan below, which runs on Linux, would count every line of them as untested.
  macos-coverage:
    name: Coverage on macOS
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Tests with coverage
        run: scripts/coverage.sh coverage-darwin.out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-darwin
          path: coverage-darwin.out
          retention-days: 1

  scan:
    name: Scan
    needs: macos-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check that SonarQube is configured
        id: gate
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "SONAR_TOKEN is not set; skipping."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 0   # the scanner needs history to attribute new code
      # The mount tests need the FUSE device, which appears when the fuse kernel module is loaded
      # (see the fuse job of ci.yml).
      - uses: ./.github/actions/fuse
        if: steps.gate.outputs.enabled == 'true'
      - uses: ./.github/actions/go-cache
        if: steps.gate.outputs.enabled == 'true'
      # The same parts that CI runs, in the same image; they leave coverage.out and
      # coverage-fuse.out where sonar-project.properties looks for them.
      - name: Tests with coverage
        if: steps.gate.outputs.enabled == 'true'
        # A backstop like the CI test steps: a hang fails in minutes, not hours.
        timeout-minutes: 10
        run: make unit fuse
      # Lands next to the two reports above; sonar-project.properties names all three.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: coverage-darwin
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        if: steps.gate.outputs.enabled == 'true'
