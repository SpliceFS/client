name: CI
# Every job has a time limit: 3 times its longest run, so a hang fails in minutes.

# Only pull requests are tested. main gets nothing but branches that passed here while they
# sat on its tip, so a run on main would test the same files a second time.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request is tested only when its branch sits on the tip of main. Then the merge adds
  # nothing that was not tested, and nothing is tested again after it: not on main, not in the
  # release. A branch that is behind fails here at once, before any long job starts. The bot
  # rebuilds every open branch when main moves, which starts the checks again.
  tip:
    name: On the tip of main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The branch contains the tip of main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.label }}
        run: |
          behind="$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq .behind_by)"
          if [ "$behind" != "0" ]; then
            echo "::error::This branch is $behind commits behind $BASE. Rebase it on the tip of $BASE; nothing is tested until then."
            exit 1
          fi
          echo "The branch contains the tip of $BASE."

  # Every part is a make target that runs in our images (see the Makefile), so each job is
  # the command a developer runs on any machine that has Docker. The parts need nothing from
  # each other and start at once. The runners hold no Go of their own: the images do.
  static:
    needs: tip
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
      - name: Format, vet, module files, ShellCheck and golangci-lint for every system
        run: make static

  # Every package but mount/fuse (see FUSE_PACKAGE in the Makefile), without FUSE, as the
  # caller.
  unit:
    needs: tip
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Codecov upload signs in with the OIDC token instead of a stored secret.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
      # A backstop, so that a hang fails the job in minutes and not in hours.
      - name: Tests with the 100% coverage gate, and the tests of the scripts
        timeout-minutes: 10
        run: make unit
      # The upload must never fail the build, for example before the organization is enabled
      # on Codecov. Forks cannot get an OIDC token for this repository.
      - name: Upload coverage to Codecov
        if: github.repository == 'SpliceFS/client' && github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.out
          disable_search: true
          fail_ci_if_error: false

  # The tests of mount/fuse mount for real, as the ordinary user of the runner, through the
  # setuid fusermount3 of the image: the way a person runs the client. The container mounts
  # through the /dev/fuse of the runner itself, and that device appears when the fuse kernel
  # module is loaded.
  fuse:
    needs: tip
    name: FUSE tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Codecov upload signs in with the OIDC token instead of a stored secret.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/fuse
      - uses: ./.github/actions/go-cache
      - name: Tests that mount, with the 100% coverage gate and the race detector
        timeout-minutes: 10
        run: make fuse
      # The same upload as in the unit job: Codecov adds the two reports of one commit together.
      - name: Upload coverage to Codecov
        if: github.repository == 'SpliceFS/client' && github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-fuse.out
          disable_search: true
          fail_ci_if_error: false

  race:
    needs: tip
    name: Tests with the race detector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
      - name: Tests with the race detector
        timeout-minutes: 10
        run: make race

  # Every program compiles for every system. The release builds the files it ships.
  build:
    needs: tip
    name: Build every program
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
      - name: Build for linux, freebsd and darwin on amd64 and arm64
        run: make build-all

  # A macOS runner cannot run Linux containers, so this is the one part that runs on the
  # machine itself, with the Go release that is current. The mount layer of macOS is only
  # tested here.
  macos:
    needs: tip
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # The fuse part runs here too: macOS has no mounts to make for mount/fuse, so it tests
      # only the files that system shares with Linux.
      - name: Tests with the 100% coverage gate, then with the race detector
        run: make unit-here fuse-here race-here

  # The FreeBSD tests are one workflow, because the Daily workflow runs them too and saves the
  # Go caches that this run restores (see freebsd-tests.yml). A pull request never saves.
  freebsd-tests:
    needs: tip
    name: FreeBSD tests
    uses: ./.github/workflows/freebsd-tests.yml
    with:
      save: false

  # The one check a branch must pass. A job that did not run counts as failed: a job is
  # skipped only when one it needs failed. A new job is added to the list when it is added
  # above, and nowhere else.
  all-checks:
    name: All checks
    needs:
      - tip
      - static
      - unit
      - fuse
      - race
      - build
      - macos
      - freebsd-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if printf '%s\n' "$NEEDS" | jq -e 'any(.[]; .result != "success")' >/dev/null; then
            echo "::error::At least one job did not succeed."
            exit 1
          fi
