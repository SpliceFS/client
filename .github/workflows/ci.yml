name: CI

# Only pull requests are tested. main gets nothing but branches that passed here while they
# sat on its tip, so a run on main would test the same files a second time.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request is tested only when its branch sits on the tip of main. Then the merge adds
  # nothing that was not tested, and nothing is tested again after it: not on main, not in the
  # release. A branch that is behind fails here at once, before any long job starts. The bot
  # rebuilds every open branch when main moves, which starts the checks again.
  tip:
    name: On the tip of main
    runs-on: ubuntu-latest
    steps:
      - name: The branch contains the tip of main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.label }}
        run: |
          behind="$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq .behind_by)"
          if [ "$behind" != "0" ]; then
            echo "::error::This branch is $behind commits behind $BASE. Rebase it on the tip of $BASE; nothing is tested until then."
            exit 1
          fi
          echo "The branch contains the tip of $BASE."

  # Every part is a make target that runs in our images (see the Makefile), so each job is
  # the command a developer runs on any machine that has Docker. The parts need nothing from
  # each other and start at once; only the packages wait, for the programs they wrap. The
  # runners hold no Go and no packages of their own: the images do.
  static:
    needs: tip
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
      - name: Format, vet, module files, ShellCheck and golangci-lint for every system
        run: make static

  # The tests of mount/fuse mount for real, so this part, the race detector and the
  # integration part run as root with the FUSE device (see MOUNT_PARTS in the Makefile), and
  # keep caches of their own (ROOT_CACHE). The container mounts through the /dev/fuse of the
  # runner itself, and that device appears when the fuse kernel module is loaded.
  unit:
    needs: tip
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov upload signs in with the OIDC token instead of a stored secret.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The FUSE device exists
        run: test -c /dev/fuse || sudo modprobe fuse
      - uses: ./.github/actions/go-cache
        with:
          folder: .cache/root
      - name: Tests with the 100% coverage gate, and the tests of the scripts
        run: make unit
      # The upload must never fail the build, for example before the organization is enabled
      # on Codecov. Forks cannot get an OIDC token for this repository.
      - name: Upload coverage to Codecov
        if: github.repository == 'SpliceFS/client' && github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.out
          disable_search: true
          fail_ci_if_error: false

  race:
    needs: tip
    name: Tests with the race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The FUSE device exists
        run: test -c /dev/fuse || sudo modprobe fuse
      - uses: ./.github/actions/go-cache
        with:
          folder: .cache/root
      - name: Tests with the race detector
        run: make race

  # Every program for every system, compiled once. The package jobs wrap these files and
  # compile nothing, so every package format ships the same binary.
  build:
    needs: tip
    name: Build every program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
      - name: Build for linux, freebsd and darwin on amd64 and arm64
        run: make build-all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin
          path: dist/bin
          if-no-files-found: error

  # The parts of the integration test are listed by scripts/compat.sh: the runs of the rule
  # below, and each group of the cluster scenarios (scripts/cluster-groups). The jobs of the
  # next job are made from that list, so a group is added to the file and nowhere else.
  integration-parts:
    needs: tip
    name: The parts of the integration test
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: List the parts
        id: parts
        run: |
          parts="$(scripts/compat.sh parts | jq -Rsc 'split("\n") | map(select(. != ""))')"
          echo "parts=$parts" >> "$GITHUB_OUTPUT"

  # The rule this proves: with the same first version number, a client works with every
  # server whose second number is equal or higher, and refuses one whose second number is
  # lower. So a change of this client must not break the released servers it has to work
  # with. The client mounts for real, as root, in a container that has FUSE. One job runs the
  # compatibility runs, and one job each runs a group of the cluster scenarios, so that no
  # job is longer than the others.
  integration:
    needs: integration-parts
    name: The real client against the real servers (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.integration-parts.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The FUSE device exists
        run: test -c /dev/fuse || sudo modprobe fuse
      - uses: ./.github/actions/go-cache
        with:
          folder: .cache/root
      - name: The real client against the real servers
        run: make integration INTEGRATION_PART=${{ matrix.part }}

  # A macOS runner cannot run Linux containers, so this is the one part that runs on the
  # machine itself, with the Go release that is current. The mount layer of macOS is only
  # tested here.
  macos:
    needs: tip
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Tests with the 100% coverage gate, then with the race detector
        run: make unit-here race-here

  fuzz:
    needs: tip
    name: Fuzz (short)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Fuzz every target briefly
        run: make fuzz

  # FreeBSD cannot run in a container, so each release runs as a virtual machine under QEMU,
  # inside the prepared image of that release (scripts/package-freebsd.sh). The runner offers
  # the hardware virtualization the machine needs, and the job stops at once when it does not.
  # The machine is amd64 and builds the packages for amd64 and arm64: the amd64 one is
  # installed and its service started, the arm64 one is checked from the file. Nothing boots
  # an arm64 machine, so no job needs an arm64 runner.
  freebsd-package:
    needs: tip
    name: FreeBSD package (${{ matrix.release }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["14.5", "15.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
      - name: Build the packages on FreeBSD, install the amd64 one and start the service
        run: make package-freebsd FREEBSD=${{ matrix.release }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freebsd-packages-${{ matrix.release }}
          path: dist/freebsd/*/*.pkg
          if-no-files-found: error

  # FreeBSD cannot run in a container, so the tests run in a virtual machine under QEMU,
  # inside the prepared image of the release (scripts/check-freebsd.sh). Only amd64: there the
  # runner offers hardware virtualization, and an emulated machine would take too long for the
  # whole test suite.
  freebsd-tests:
    needs: tip
    name: FreeBSD tests (${{ matrix.release }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["14.5", "15.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-cache
      - name: Tests on FreeBSD, as root with FUSE, 100% coverage
        run: make check-freebsd FREEBSD=${{ matrix.release }}

  # The packages of every format, from the programs of the build job, once for each CPU type
  # the runners offer. The repositories are made here too, because they need the packages of
  # all three formats. The jobs below test what this job leaves in dist.
  packages:
    needs: build
    name: Packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin
          path: dist/bin
      - name: Build the deb, rpm and apk packages
        run: make packages
      - name: Build the signed package repositories
        run: make repo
      # The keys are throwaway keys made in this run, because no real key is given to a pull
      # request; publish-test signs with them. Nothing signed with them is published.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/alpine/
            dist/repo/
            dist/keys/
          if-no-files-found: error

  # One job for each package format and CPU type. A step that fails does not stop the next
  # one: each test says what is broken, and one run should show all of it.
  package-tests:
    needs: packages
    name: Package tests (${{ matrix.format }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm, apk]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: dist
      - name: Install and remove the package in a clean system of every release
        run: make package-test ONLY=${{ matrix.format }}
      # The containers above have no service manager running. These do: process 1 is
      # systemd or OpenRC, and the service must start by itself, come back after a reboot
      # and stop when the package is removed.
      - name: Start the service under the real service manager of every release
        if: ${{ !cancelled() }}
        run: make service-test ONLY=${{ matrix.format }}
      - name: Install from the repository with signature checks on
        if: ${{ !cancelled() }}
        run: make repo-test ONLY=${{ matrix.format }}

  publish-test:
    needs: packages
    name: Publish checks (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: dist
      - name: Publish and release-file checks against local folders, no server
        run: make publish-test

  # The one check a branch must pass. A job that did not run counts as failed: a job is
  # skipped only when one it needs failed. A new job is added to the list when it is added
  # above, and nowhere else.
  all-checks:
    name: All checks
    needs:
      - tip
      - static
      - unit
      - race
      - build
      - integration-parts
      - integration
      - macos
      - fuzz
      - freebsd-package
      - freebsd-tests
      - packages
      - package-tests
      - publish-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if printf '%s\n' "$NEEDS" | jq -e 'any(.[]; .result != "success")' >/dev/null; then
            echo "::error::At least one job did not succeed."
            exit 1
          fi
