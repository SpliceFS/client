name: Release keys
description: Writes the OpenPGP signing key of the release files to a file for make release-assets.

# Only the release job signs, and it signs one thing: SHA256SUMS. The secret reaches this action
# as an input, because an action cannot read the secrets of the workflow itself, and only a job
# of the publish environment has it. The files are found through variables that every later
# step of the job sees: SIGNING_KEY_FILE for the secret key and KEYS_DIR for the folder with the
# public key that the signature is checked against (see scripts/release-assets.sh).
inputs:
  signing-openpgp-subkey:
    description: The OpenPGP signing subkey, armored, for the release files.
    required: true

runs:
  using: composite
  steps:
    # Only the public key file is used from this repository.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: SpliceFS/packages
        path: public-keys
    - name: Write the signing key to a file
      shell: bash
      env:
        SIGNING_OPENPGP_SUBKEY: ${{ inputs.signing-openpgp-subkey }}
      run: |
        umask 077
        mkdir "$RUNNER_TEMP/signing"
        printf '%s\n' "$SIGNING_OPENPGP_SUBKEY" \
          > "$RUNNER_TEMP/signing/splicefs-openpgp-signing-subkey.asc"
        cp public-keys/keys/splicefs.asc "$RUNNER_TEMP/signing/"
        {
          echo "SIGNING_KEY_FILE=$RUNNER_TEMP/signing/splicefs-openpgp-signing-subkey.asc"
          echo "KEYS_DIR=$RUNNER_TEMP/signing"
        } >> "$GITHUB_ENV"
