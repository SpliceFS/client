name: Remove release keys
description: Removes the file that the release-keys action wrote.

# The last step of the job that used release-keys, run whether the job failed or not. The runner
# is thrown away after the job, so this is a second line of defence.
runs:
  using: composite
  steps:
    - name: Remove the secret files
      shell: bash
      run: rm -rf "$RUNNER_TEMP/signing"
