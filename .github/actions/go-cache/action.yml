name: Go caches
description: Restores and saves the module and build caches that the Go parts mount into their image.

# Every job that runs Go in the image does the same three things here, so they are written
# once. The folders are the ones the Makefile mounts (CACHE). Each job keeps its own entry: a
# race build, a test build and a lint run fill the build cache with different objects, and one
# shared entry would hold only whichever job finished first.
inputs:
  save:
    description: Whether the job saves the caches when it ends. "false" only restores them.
    default: "true"

runs:
  using: composite
  steps:
    # The image is named in the Makefile and nowhere else; a new image starts with new caches.
    # Both cache steps below take their keys from this one name, so they cannot differ.
    - name: Name the cache entry of this job
      id: entry
      shell: bash
      run: echo "prefix=go-$GITHUB_JOB-$RUNNER_OS-$RUNNER_ARCH-$(make -s go-image)-" >> "$GITHUB_OUTPUT"
    - name: Restore the caches, and save them when the job ends
      if: inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .cache/gomod
          .cache/gobuild
        key: ${{ steps.entry.outputs.prefix }}${{ hashFiles('go.sum') }}
        # A change of go.sum starts from the caches of the last one; Go adds what is missing.
        restore-keys: ${{ steps.entry.outputs.prefix }}
    - name: Restore the caches only
      if: inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .cache/gomod
          .cache/gobuild
        key: ${{ steps.entry.outputs.prefix }}${{ hashFiles('go.sum') }}
        restore-keys: ${{ steps.entry.outputs.prefix }}
